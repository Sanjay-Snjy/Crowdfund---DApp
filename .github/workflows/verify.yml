name: Verify Contract on Etherscan

on:
  workflow_dispatch:
    inputs:
      contract_address:
        description: "Deployed contract address to verify"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web3/package-lock.json

      - name: Install dependencies
        working-directory: web3
        run: npm ci

      - name: Verify contract on Etherscan
        working-directory: web3
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NETWORK_RPC_URL: ${{ secrets.NETWORK_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          npx hardhat verify --network sepolia ${{ github.event.inputs.contract_address }} --show-stack-traces
